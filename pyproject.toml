[project]
name = "news-notify-app"
version = "0.1.0"
description = "News aggregation and notification application"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.31.0",
    "feedparser>=6.0.10",
    "pydantic>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "apscheduler>=3.10.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "sqlmodel>=0.0.27",
    "alembic>=1.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["E501", "D100", "D107"]

[tool.ruff.format]
# quote-style = "single"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D100", "D104", "F401"]

[dependency-groups]
dev = ["pytest>=7.4.0", "pytest-asyncio>=0.21.0", "pre-commit>=3.5.0"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[project.scripts]
app = "app:run_scheduler"
app-once = "app:run_once"
api = "api:run_api"
test = "scripts.test:run_all_tests"
test-api = "scripts.test:run_api_tests"
setup-hooks = "scripts.setup_hooks:setup_pre_push"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
